max_retries: 3

# Role convention enforced by the server (see ROLE_ASSIGNMENTS in server.py):
#   task_type="implementation"     -> agent="pi"      (implements stories)
#   task_type="code_review_heavy"  -> agent="qoder"   (thorough/slow review)
#   task_type="code_review_light"  -> unrestricted    (fast/first-pass review;
#                                       dispatch to qoder or pi for a second opinion)
# Dispatch independent reviewers in parallel — dispatch_worker runs each CLI as
# an asyncio subprocess, so concurrent calls don't queue behind each other.
#
# OpenCode was removed as a worker: its headless-mode CLI invocation kept
# regressing back to printing top-level --help instead of running, across
# multiple fix attempts. Pi and Qoder have run reliably in headless mode.

workers:
  pi:
    # Invocation: pi --approve --print <prompt>
    # -p/--print is required for non-interactive mode; without it pi also
    # drops into its interactive TUI and never reports completion.
    bin: pi
    extra_flags:
      - "--approve"            # trust project-local files for this run
      - "--print"              # non-interactive mode: process prompt and exit
    new_session_flag: ""
    continue_flag: "--continue"
    session_id_flag: "--session"
  qoder:
    # Invocation: qoder --dangerously-skip-permissions --print <prompt>
    bin: qoder
    extra_flags:
      - "--dangerously-skip-permissions"
      - "--print"              # non-interactive mode
    new_session_flag: ""
    continue_flag: "--continue"
    session_id_flag: "--resume"

haiku_model: "claude-haiku-4-5-20251001"
anthropic_api_key_env: "ANTHROPIC_API_KEY"
